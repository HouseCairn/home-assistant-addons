# yamllint configuration (https://yamllint.readthedocs.io).
extends: default

rules:
  # GitHub Actions uses the `on` key, which YAML 1.1 reads as a boolean.
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  line-length:
    max: 120
  # Most files of this repository are read by the Supervisor, which does not
  # need a document start marker.
  document-start: disable
  comments:
    min-spaces-from-content: 1
